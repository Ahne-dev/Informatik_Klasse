<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktive Cäsarscheibe - Schulversion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f1f5f9;
        }

        .wheel-container {
            position: relative;
            width: 340px;
            height: 340px;
            user-select: none;
            touch-action: none;
        }

        #inner-wheel {
            transition: transform 0.3s cubic-bezier(0.2, 0, 0.2, 1);
            cursor: grab;
        }

        #inner-wheel:active {
            cursor: grabbing;
            transition: none;
        }

        .alphabet-text {
            font-weight: 800;
            font-size: 15px;
        }

        .label-text {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 800;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Verstecken von Elementen */
        .hidden-mode { display: none; }
    </style>
</head>
<body class="min-h-screen py-10 px-4 flex flex-col items-center">
    
    <div class="max-w-4xl w-full">
        <!-- Zurück zur Übersicht Button -->
        <nav class="mb-8 flex justify-start">
            <a href="index.html" class="flex items-center gap-2 px-5 py-2.5 bg-slate-800 text-white font-semibold rounded-xl border border-slate-700 shadow-xl hover:bg-slate-700 transition-all active:scale-95">
                <span>🏠</span>
                <span>Zurück zur Übersicht</span>
            </a>
        </nav>

        <!-- Modus Auswahl (Tabs) -->
        <div class="flex justify-center mb-8">
            <div class="bg-slate-800 p-1 rounded-xl flex gap-1 border border-slate-700 shadow-xl">
                <button id="tab-student" class="px-6 py-2 rounded-lg font-bold transition-all bg-blue-600 text-white">
                    Schüler (Lernmodus)
                </button>
                <button id="tab-teacher" class="px-6 py-2 rounded-lg font-bold transition-all text-slate-400 hover:text-white">
                    Lehrer (Lösung)
                </button>
            </div>
        </div>

        <!-- Header -->
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-white mb-2 tracking-tight">Cäsarscheibe</h1>
            <p id="mode-description" class="text-slate-400 italic">Prüfungsmodus: Nutze die Scheibe zum manuellen Entschlüsseln.</p>
        </header>

        <div class="grid md:grid-cols-2 gap-10 items-start">
            
            <!-- Linke Spalte: Die Scheibe -->
            <div class="flex flex-col items-center">
                <div class="wheel-container mb-8 bg-slate-800 rounded-full shadow-[0_0_50px_rgba(0,0,0,0.5)] p-2 border-4 border-slate-700">
                    <svg viewBox="0 0 400 400" id="caesar-svg" class="w-full h-full">
                        <circle cx="200" cy="200" r="195" fill="#f8fafc" />
                        <text x="200" y="58" text-anchor="middle" class="fill-slate-400 label-text">Klartext</text>
                        <g id="outer-alphabet" class="fill-slate-900 alphabet-text"></g>
                        
                        <g id="inner-wheel">
                            <circle cx="200" cy="200" r="135" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" />
                            <circle cx="200" cy="200" r="130" fill="none" stroke="rgba(0,0,0,0.05)" stroke-width="1" />
                            <text x="200" y="245" text-anchor="middle" class="fill-slate-400 label-text" style="pointer-events: none;">Geheimtext</text>
                            <g id="inner-alphabet" class="fill-blue-700 alphabet-text"></g>
                            <circle cx="200" cy="200" r="8" fill="#3b82f6" />
                        </g>
                        
                        <path d="M194 5 L206 5 L200 18 Z" fill="#ef4444" />
                        <rect x="199" y="5" width="2" height="45" fill="#ef4444" opacity="0.4" />
                    </svg>
                </div>

                <div class="w-full glass-card p-6 rounded-2xl shadow-xl">
                    <div class="flex items-center justify-between mb-4">
                        <label class="font-bold text-slate-300">Verschiebung (Key):</label>
                        <span id="shift-display" class="bg-blue-600 text-white px-4 py-1 rounded-full font-mono text-xl shadow-lg shadow-blue-900/20">0</span>
                    </div>
                    <input type="range" id="shift-slider" min="0" max="25" value="0" 
                           class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500">
                </div>
            </div>

            <!-- Rechte Spalte: Textfelder -->
            <div class="space-y-6">
                <!-- Eingabe -->
                <div class="glass-card p-6 rounded-2xl shadow-lg">
                    <label class="block text-sm font-bold text-slate-400 mb-3 uppercase tracking-widest">Klartext (Eingabe)</label>
                    <textarea id="plaintext" placeholder="Nachricht für die Schüler..." 
                        class="w-full h-32 p-4 bg-slate-900/50 border border-slate-700 text-white rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all resize-none"></textarea>
                </div>

                <!-- Ausgabe (Konditional im Lehrermodus) -->
                <div id="result-container" class="glass-card p-6 rounded-2xl shadow-lg relative overflow-hidden">
                    <div id="lock-overlay" class="absolute inset-0 bg-slate-900/80 backdrop-blur-sm flex flex-col items-center justify-center text-center p-4 z-10">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-slate-500 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                        <p class="text-slate-400 text-sm font-semibold uppercase tracking-tighter">Lösung im Schülermodus deaktiviert</p>
                    </div>

                    <label class="block text-sm font-bold text-blue-400 mb-3 uppercase tracking-widest">Geheimtext (Lösung)</label>
                    <textarea id="ciphertext" placeholder="Die Lösung erscheint hier nur für Lehrer..." readonly
                        class="w-full h-32 p-4 bg-blue-950/30 border border-blue-900/30 text-blue-100 rounded-xl font-mono outline-none transition-all resize-none"></textarea>
                    
                    <button id="copy-btn" class="mt-4 w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-xl transition-all flex items-center justify-center gap-2 active:scale-[0.98]">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                        Lösung kopieren
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Passwort Modal -->
    <div id="password-modal" class="fixed inset-0 bg-black/60 backdrop-blur-md z-[100] hidden items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 p-8 rounded-3xl shadow-2xl max-w-sm w-full">
            <h3 class="text-xl font-bold mb-4 text-center">Lehrermodus aktivieren</h3>
            <p class="text-slate-400 text-sm mb-6 text-center">Bitte gib das Passwort ein, um die automatische Übersetzung freizuschalten.</p>
            <input type="password" id="password-input" placeholder="Passwort" 
                class="w-full p-4 bg-slate-900 border border-slate-700 rounded-xl text-white mb-4 focus:ring-2 focus:ring-blue-500 outline-none">
            <div class="flex gap-2">
                <button id="pass-cancel" class="flex-1 py-3 px-4 bg-slate-700 hover:bg-slate-600 rounded-xl font-bold transition-all">Abbrechen</button>
                <button id="pass-submit" class="flex-1 py-3 px-4 bg-blue-600 hover:bg-blue-500 rounded-xl font-bold transition-all text-white">Bestätigen</button>
            </div>
            <p id="pass-error" class="text-red-500 text-xs mt-3 text-center opacity-0">Falsches Passwort!</p>
        </div>
    </div>

    <!-- Notification -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-blue-600 text-white px-8 py-3 rounded-full shadow-2xl opacity-0 transition-opacity pointer-events-none z-[110] font-bold">
        Kopiert!
    </div>

    <script>
        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const outerG = document.getElementById('outer-alphabet');
        const innerG = document.getElementById('inner-alphabet');
        const innerWheel = document.getElementById('inner-wheel');
        const shiftSlider = document.getElementById('shift-slider');
        const shiftDisplay = document.getElementById('shift-display');
        const plaintextArea = document.getElementById('plaintext');
        const ciphertextArea = document.getElementById('ciphertext');
        const copyBtn = document.getElementById('copy-btn');
        const toast = document.getElementById('toast');
        
        // Mode Controls
        const tabStudent = document.getElementById('tab-student');
        const tabTeacher = document.getElementById('tab-teacher');
        const lockOverlay = document.getElementById('lock-overlay');
        const modeDesc = document.getElementById('mode-description');
        const passwordModal = document.getElementById('password-modal');
        const passwordInput = document.getElementById('password-input');
        const passSubmit = document.getElementById('pass-submit');
        const passCancel = document.getElementById('pass-cancel');
        const passError = document.getElementById('pass-error');

        let currentShift = 0;
        let isTeacherMode = false;
        const TEACHER_PASSWORD = "Lehrer2026!";

        function createAlphabetLabels(container, radius) {
            for (let i = 0; i < 26; i++) {
                const angle = (i * 360 / 26) - 90;
                const x = 200 + radius * Math.cos(angle * Math.PI / 180);
                const y = 200 + radius * Math.sin(angle * Math.PI / 180);
                const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                text.setAttribute("x", x);
                text.setAttribute("y", y);
                text.setAttribute("text-anchor", "middle");
                text.setAttribute("dominant-baseline", "central");
                text.setAttribute("transform", `rotate(${angle + 90}, ${x}, ${y})`);
                text.textContent = alphabet[i];
                container.appendChild(text);
            }
        }

        createAlphabetLabels(outerG, 172);
        createAlphabetLabels(innerG, 110);

        function caesarCipher(text, shift) {
            return text.toUpperCase().replace(/[A-Z]/g, char => {
                const index = alphabet.indexOf(char);
                const newIndex = (index + shift) % 26;
                return alphabet[newIndex];
            });
        }

        function updateOutput() {
            if (isTeacherMode) {
                const text = plaintextArea.value;
                ciphertextArea.value = caesarCipher(text, currentShift);
            } else {
                ciphertextArea.value = "";
            }
        }

        function setShift(val) {
            currentShift = parseInt(val);
            shiftDisplay.textContent = currentShift;
            shiftSlider.value = currentShift;
            const rotation = -(currentShift * 360 / 26);
            innerWheel.style.transform = `rotate(${rotation}deg)`;
            innerWheel.style.transformOrigin = "200px 200px";
            updateOutput();
        }

        // Mode Toggling Logic
        tabStudent.addEventListener('click', () => {
            isTeacherMode = false;
            tabStudent.classList.add('bg-blue-600', 'text-white');
            tabStudent.classList.remove('text-slate-400');
            tabTeacher.classList.remove('bg-blue-600', 'text-white');
            tabTeacher.classList.add('text-slate-400');
            lockOverlay.classList.remove('hidden');
            modeDesc.textContent = "Prüfungsmodus: Nutze die Scheibe zum manuellen Entschlüsseln.";
            updateOutput();
        });

        tabTeacher.addEventListener('click', () => {
            if (!isTeacherMode) {
                passwordModal.classList.remove('hidden');
                passwordModal.classList.add('flex');
                passwordInput.focus();
            }
        });

        passCancel.addEventListener('click', () => {
            passwordModal.classList.add('hidden');
            passwordModal.classList.remove('flex');
            passwordInput.value = "";
            passError.style.opacity = "0";
        });

        function verifyPassword() {
            if (passwordInput.value === TEACHER_PASSWORD) {
                isTeacherMode = true;
                passwordModal.classList.add('hidden');
                passwordModal.classList.remove('flex');
                
                tabTeacher.classList.add('bg-blue-600', 'text-white');
                tabTeacher.classList.remove('text-slate-400');
                tabStudent.classList.remove('bg-blue-600', 'text-white');
                tabStudent.classList.add('text-slate-400');
                
                lockOverlay.classList.add('hidden');
                modeDesc.textContent = "Lehrermodus: Automatische Übersetzung ist aktiv.";
                
                passwordInput.value = "";
                passError.style.opacity = "0";
                updateOutput();
            } else {
                passError.style.opacity = "1";
                passwordInput.classList.add('border-red-500');
                setTimeout(() => passwordInput.classList.remove('border-red-500'), 1000);
            }
        }

        passSubmit.addEventListener('click', verifyPassword);
        passwordInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') verifyPassword(); });

        // Basic Listeners
        shiftSlider.addEventListener('input', (e) => setShift(e.target.value));
        plaintextArea.addEventListener('input', updateOutput);
        copyBtn.addEventListener('click', () => {
            if (!ciphertextArea.value) return;
            ciphertextArea.select();
            document.execCommand('copy');
            toast.style.opacity = "1";
            setTimeout(() => toast.style.opacity = "0", 2000);
        });

        // Wheel Rotation Logic
        let isDragging = false;
        let startAngle = 0;
        const getAngle = (x, y) => {
            const rect = document.getElementById('caesar-svg').getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            return Math.atan2(y - centerY, x - centerX) * 180 / Math.PI;
        };
        const handleStart = (e) => {
            isDragging = true;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            startAngle = getAngle(clientX, clientY);
            innerWheel.style.transition = "none";
        };
        const handleMove = (e) => {
            if (!isDragging) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const currentAngle = getAngle(clientX, clientY);
            let diff = currentAngle - startAngle;
            let rawShift = Math.round(-(diff / (360/26)));
            let newShift = (currentShift + rawShift) % 26;
            if (newShift < 0) newShift += 26;
            if (newShift !== currentShift) {
                setShift(newShift);
                startAngle = currentAngle;
            }
            if (e.cancelable) e.preventDefault();
        };
        const handleEnd = () => {
            isDragging = false;
            innerWheel.style.transition = "transform 0.3s cubic-bezier(0.2, 0, 0.2, 1)";
        };
        innerWheel.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);
        innerWheel.addEventListener('touchstart', handleStart, { passive: false });
        window.addEventListener('touchmove', handleMove, { passive: false });
        window.addEventListener('touchend', handleEnd);
    </script>
</body>
</html>
